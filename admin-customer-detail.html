<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Workflow — Lao Web Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><header class="admin-header"><a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>LAO WEB STUDIO</span></a><a class="btn btn-secondary" href="admin-customers.html">← กลับหน้าลูกค้า</a></header>
<main class="admin-main v27-detail"><p id="page-status" class="save-status"></p><section class="v27-customer-head"><div><span class="mini-label">CUSTOMER WORKFLOW · V2.7</span><h1 id="customer-name">Customer</h1><p id="customer-business"></p></div><div id="customer-contact" class="v27-contact-actions"></div></section>
<div class="v27-detail-grid"><section class="pricing-admin-card"><div class="admin-list-head"><div><span class="mini-label">WORKFLOW</span><h2>สถานะและงานถัดไป</h2></div></div><form id="workflow-form" class="v27-workflow-form"><label>สถานะ<select id="status"></select></label><label>ความสำคัญ<select id="priority"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label><label>ผู้รับผิดชอบ<select id="owner"></select></label><label>วันติดตาม<input id="next_follow_up" type="date"></label><label>กำหนดส่ง<input id="deadline" type="date"></label><label>ชื่อโปรเจกต์<input id="project_name"></label><label class="wide">หมายเหตุ Admin<textarea id="admin_note" rows="4"></textarea></label><button id="save" class="btn btn-primary" type="submit">บันทึก Workflow</button><span id="save-status" class="save-status"></span></form></section>
<section class="pricing-admin-card"><span class="mini-label">REQUEST</span><h2>ข้อมูลงานที่ลูกค้าต้องการ</h2><div id="service-info" class="v27-service-info"></div></section></div>
<div class="v27-detail-grid"><section class="pricing-admin-card"><span class="mini-label">QUOTATIONS</span><h2>ใบเสนอราคา</h2><div id="quotes" class="v27-mini-list"></div></section><section class="pricing-admin-card"><span class="mini-label">APPOINTMENTS</span><h2>นัดหมาย</h2><div id="appointments" class="v27-mini-list"></div></section></div>
<div class="v27-detail-grid"><section class="pricing-admin-card"><span class="mini-label">FILES</span><h2>ไฟล์ลูกค้า</h2><div id="files" class="v27-file-grid"></div></section><section class="pricing-admin-card"><span class="mini-label">ACTIVITY</span><h2>ประวัติการทำงาน</h2><form id="activity-form" class="v27-activity-form"><input id="activity-title" placeholder="หัวข้อ เช่น โทรติดตามลูกค้า" required><textarea id="activity-detail" rows="2" placeholder="รายละเอียด"></textarea><button class="btn btn-secondary" type="submit">+ เพิ่มบันทึก</button></form><div id="activities" class="v27-activity-list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="admin-customer-detail.js"></script></body></html>
